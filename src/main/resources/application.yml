spring:
  application:
    name: day1

  h2:
    console:
      enabled: true

  jpa:
    defer-datasource-initialization: true

  ai:
    openai:
      # 키는 소스에 넣지 않는다.  export OPENAI_API_KEY="sk-..."
      api-key: ${OPENAI_API_KEY}
      chat:
        options:
          model: gpt-4o-mini
      embedding:
        options:
          model: text-embedding-3-small

server:
  port: 8080

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    doc-expansion: none
    display-request-duration: true

logging:
  pattern:
    # 한 요청을 처음부터 끝까지 따라가려면 추적 ID 가 모든 줄에 있어야 한다
    level: "%5p [%X{traceId:-}]"
  level:
    skala.springai: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: "health,info,metrics" # 또는 "*" 로 전체 노출
  endpoint:
    metrics:
      enabled: true